[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-life-2d"
version = "0.1.0"
description = "Independent lifelong learners in a fast 2D artificial-life environment"
requires-python = ">=3.12"
dependencies = ["torch>=2.12", "numpy>=2", "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "playwright>=1.58"]

[project.scripts]
ailife = "ailife.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ailife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
